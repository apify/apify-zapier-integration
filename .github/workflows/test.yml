name: Test

on:
    workflow_dispatch:
    pull_request:
        branches:
            - master

jobs:
    run-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              with:
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'
            - run: npm ci
            - run: ./node_modules/.bin/zapier-platform validate --without-style
            - run: npm run lint
            - run: npm run test

    run-e2e-test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v2
                with:
                    persist-credentials: false
            -   name: Use Node.js
                uses: actions/setup-node@v3
                with:
                    node-version-file: '.nvmrc'
            -   run: npm ci
            -   run: ./node_modules/.bin/zapier-platform validate --without-style
            -   run: npm run lint
            -   run: npm run test
                env:
                    TEST_USER_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
