name: Test

on:
    workflow_dispatch:
    pull_request:
        branches:
            - master

jobs:
    run-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
            - name: Use Node.js
              uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
              with:
                  node-version-file: '.nvmrc'
            - run: npm install -g zapier-platform-cli
            - run: npm install
            - run: zapier-platform validate --without-style
            - run: npm run lint
            - run: npm run test

    run-e2e-test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
            -   name: Use Node.js
                uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
                with:
                    node-version-file: '.nvmrc'
            -   run: npm install -g zapier-platform-cli
            -   run: npm install
            -   run: zapier-platform validate --without-style
            -   run: npm run lint
            -   run: npm run test
                env:
                    TEST_USER_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
