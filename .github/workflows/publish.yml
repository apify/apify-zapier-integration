name: Release & Publish Apify on Zapier
# Started by `release-published.yml`, so that it runs from master and can use the environment that holds the token.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to publish (e.g. v1.2.3)
                required: true
                type: string
            target-branch:
                description: Branch that receives the version bump commit
                required: false
                type: string
                default: master

jobs:
    setup_and_test:
        runs-on: ubuntu-latest
        environment: automation
        permissions:
            contents: write
        steps:
            # The tag's code runs with the token below, so it has to be code that already went through master.
            - name: Check that the tag is on master
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...refs/tags/${TAG}" --jq .status)
                  if [[ "$status" != "identical" && "$status" != "behind" ]]; then
                      echo "::error::${TAG} is not on master"
                      exit 1
                  fi

            - name: Checkout code
              uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
              with:
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
                  ref: refs/tags/${{ inputs.tag }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: npm ci --no-audit

            - name: Validate Zapier app
              run: ./node_modules/.bin/zapier-platform validate --without-style

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm run test
              env:
                  TEST_USER_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}

            - name: Configure git
              run: |
                  git config --global user.name "Apify Service Account"
                  git config --global user.email "apify-service-account@users.noreply.github.com"

            - name: Extract release version
              id: get_version
              run: |
                  FULL_TAG_NAME="${{ inputs.tag }}"
                  VERSION_NUMBER="${FULL_TAG_NAME#v}"
                  echo "VERSION=${VERSION_NUMBER}" >> $GITHUB_ENV

            - name: Bump package.json version
              run: |
                  echo "Updating package.json version to ${{ env.VERSION }}"
                  npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version

            - name: Update CHANGELOG.md
              run: |
                  RELEASE_BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
                  if [ -n "$RELEASE_BODY" ]; then
                    # Get current date in YYYY-MM-DD format
                    CURRENT_DATE=$(date '+%Y-%m-%d')

                    # Check if CHANGELOG.md already contains this version
                    if [ -f CHANGELOG.md ] && grep -q "## ${{ env.VERSION }} /" CHANGELOG.md; then
                      echo "CHANGELOG.md already contains version ${{ env.VERSION }}. Skipping update."
                    else
                      # Create temporary file with new entry
                      echo "## ${{ env.VERSION }} / ${CURRENT_DATE}" > temp_changelog.md
                      echo "$RELEASE_BODY" >> temp_changelog.md
                      echo "" >> temp_changelog.md

                      # Append existing CHANGELOG.md content if it exists
                      if [ -f CHANGELOG.md ]; then
                        cat CHANGELOG.md >> temp_changelog.md
                      fi

                      # Replace the original CHANGELOG.md with the new one
                      mv temp_changelog.md CHANGELOG.md
                      echo "CHANGELOG.md updated with release notes for version ${{ env.VERSION }}."
                    fi
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}

            - name: Commit changes
              run: |
                  git add package.json package-lock.json CHANGELOG.md
                  if ! git diff --staged --quiet; then
                      TARGET_BRANCH="${{ inputs.target-branch }}"
                      echo "Target branch for push: $TARGET_BRANCH"
                      git commit -m "chore(release): set version to ${{ env.VERSION }}"
                      echo "Pushing changes to $TARGET_BRANCH"
                      git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:"refs/heads/$TARGET_BRANCH"
                  else
                      echo "No changes to commit."
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Push Zapier app
              run: ./node_modules/.bin/zapier-platform push
              env:
                  ZAPIER_DEPLOY_KEY: ${{ secrets.APIFY_ZAPIER_DEPLOY_KEY }}

            - name: Promote new version
              run: ./node_modules/.bin/zapier-platform promote --yes ${{ env.VERSION }}
              env:
                  ZAPIER_DEPLOY_KEY: ${{ secrets.APIFY_ZAPIER_DEPLOY_KEY }}
